[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "darkdna-observer"
version = "0.1.0"
description = "Sequence-first dark/noncoding DNA anomaly observer for assay-generating hypotheses."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DarkDNA Observer contributors" }]
dependencies = [
  "typer>=0.9",
  "pydantic>=2",
  "pandas>=2",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pyarrow>=12",
  "jinja2>=3",
  "matplotlib>=3",
  "networkx>=3",
  "PyYAML>=6",
]

[project.optional-dependencies]
intervals = ["pyranges", "pybedtools"]
fasta = ["biopython", "pyfaidx", "pyfastx"]
tracks = ["pyBigWig"]
physical = ["rpy2", "dnacurve"]
scale = ["PyWavelets", "nolds", "antropy", "scikit-bio"]
boosting = ["xgboost", "lightgbm"]
reports = ["plotly", "rich"]
dev = ["pytest>=8"]

[project.scripts]
darkdna = "darkdna.cli:app"

[tool.setuptools.packages.find]
include = ["darkdna*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: integration tests requiring generated reference files",
  "download: tests that require internet access",
  "slow: slower tests",
]
