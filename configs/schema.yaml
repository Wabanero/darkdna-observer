type: object
required:
  - project_name
properties:
  project_name:
    type: string
  random_seed:
    type: integer
    default: 13
  window_sizes:
    type: array
    items: { type: integer, minimum: 1 }
    default: [200, 1000, 5000, 10000, 50000]
  step_fraction:
    type: number
    minimum: 0.01
    maximum: 1.0
    default: 0.5
  exclude_coding_exons:
    type: boolean
    default: true
  promoter_bp:
    type: integer
    default: 1000
  artifact_thresholds:
    type: object
  primitive_thresholds:
    type: object
  analysis_modes:
    type: object
    properties:
      sequence_specific: { type: object, properties: { enabled: { type: boolean, default: true } } }
      sequence_indifferent: { type: object, properties: { enabled: { type: boolean, default: false } } }
      conformation: { type: object, properties: { enabled: { type: boolean, default: false } } }
      transcription_rna: { type: object, properties: { enabled: { type: boolean, default: false } } }
      dynamic: { type: object, properties: { enabled: { type: boolean, default: false } } }
      evolution: { type: object, properties: { enabled: { type: boolean, default: false } } }
  sequence_indifferent:
    type: object
    properties:
      analysis_levels: { type: object }
      interval_sources: { type: object }
      phenotype_table: { type: [string, "null"] }
      null_models: { type: object }
      transformation_replicates: { type: integer, minimum: 1, default: 5 }
      kmer_size: { type: integer, minimum: 1, default: 3 }
  evolution:
    type: object
    properties:
      evolutionary_null_enabled: { type: boolean, default: false }
      n_surrogates: { type: integer, minimum: 1, default: 25 }
  null_models:
    type: object
    properties:
      block_size_bp: { type: integer, minimum: 1, default: 100000 }
      minimum_independent_blocks: { type: integer, minimum: 2, default: 5 }
      agreement_z_threshold: { type: number, default: 2.0 }
  default_state_benchmark:
    type: object
    properties:
      enabled: { type: boolean, default: false }
      max_windows: { type: integer, minimum: 1, default: 256 }
      local_block_size: { type: integer, minimum: 2, default: 1000 }
      foundation_model_paths: { type: object }
  statistics:
    type: object
